name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -w packages/shared && npm run build -w packages/cli

      - name: Typecheck
        run: npm run typecheck -w packages/cli

      - name: Test
        run: npm test

  e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/dashboard

      - name: Run E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report/
          retention-days: 7

  install-test:
    name: npm install test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install from npm
        run: npm install -g @blissful-infra/cli

      - name: Verify CLI works
        run: |
          VERSION=$(blissful-infra --version)
          echo "Installed version: $VERSION"
          echo "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
