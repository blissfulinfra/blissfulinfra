apiVersion: v1
kind: ConfigMap
metadata:
  name: {{SERVICE_NAME}}-config
  labels:
    app: {{SERVICE_NAME}}
data:
  # Identity tags picked up by the Spring Boot template's micrometer config.
  TENANT_NAME: "{{TENANT_NAME}}"
  PROJECT_NAME: "{{PROJECT_NAME}}"
  SERVICE_NAME: "{{SERVICE_NAME}}"
  LOGGING_LEVEL_ROOT: "INFO"
  # Frontend nginx wiring: the react-vite image envsubsts its nginx.conf at
  # boot and crashes without these. The backend's combined k8s Service shares
  # its compose hostname, so in-cluster DNS just works. Harmless for backends.
  BACKEND_HOST: "{{BACKEND_HOST}}"
  BACKEND_PORT: "8080"
  NGINX_ENVSUBST_FILTER: "^BACKEND_"
