# Gitea Actions (ADR-0023). GitHub Actions-compatible syntax.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Container image builds
        run: docker build -t {{PROJECT_NAME}}:ci .
